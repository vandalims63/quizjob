<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Спасибо — LaserLove</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root { --gold: #f5c518; }

    html {
      background: #0f3460;
    }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      background-size: 200% 200%;
      animation: gradientShift 18s ease infinite;
      color: #fff;
      padding: calc(32px + env(safe-area-inset-top)) 20px calc(64px + env(safe-area-inset-bottom));
      text-align: center;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.3;
      z-index: 0;
      pointer-events: none;
      will-change: transform;
    }

    .blob-1 {
      width: 300px; height: 300px;
      background: rgba(39, 174, 96, 0.45);
      top: -90px; left: -110px;
      animation: float1 17s ease-in-out infinite;
    }

    .blob-2 {
      width: 260px; height: 260px;
      background: rgba(245, 197, 24, 0.4);
      bottom: -110px; right: -90px;
      animation: float2 21s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 70px) scale(1.15); }
    }

    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-60px, -50px) scale(1.1); }
    }

    .container {
      max-width: 440px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .check-icon {
      width: 84px;
      height: 84px;
      background: rgba(39, 174, 96, 0.15);
      border: 3px solid #27ae60;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      margin: 0 auto 28px;
      animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      box-shadow: 0 0 0 rgba(39, 174, 96, 0.4);
    }

    .check-icon::after {
      content: "";
      position: absolute;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 2px solid rgba(39, 174, 96, 0.5);
      animation: ripple 2.4s ease-out infinite;
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 16px;
      line-height: 1.35;
      animation: fadeUp 0.7s ease both;
      animation-delay: 0.25s;
    }

    .message {
      font-size: 16px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 36px;
      animation: fadeUp 0.7s ease both;
      animation-delay: 0.4s;
    }

    .brand {
      font-family: 'Unbounded', sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 40px;
      animation: fadeUp 0.7s ease both;
      animation-delay: 0.55s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="container">
    <div class="check-icon">✓</div>
    <h1>Спасибо, вы успешно заполнили анкету! 💛</h1>
    <p class="message">
      Мы получили вашу заявку на вакансию мастера лазерной эпиляции в Кракове.<br><br>
      Мы свяжемся с вами в ближайшее время.
    </p>
    <div class="brand">LaserLove · Краков</div>
  </div>
</body>
</html>
